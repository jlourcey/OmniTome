# ─────────────────────────────────────────────────────────────────────────────
# Version Catalog — single source of truth for all dependency versions.
# Reference these in build.gradle.kts via libs.* accessors.
# ─────────────────────────────────────────────────────────────────────────────

[versions]
kotlin                  = "2.2.10"
appcompat               = "1.7.0"
agp                     = "9.2.1"
composeBom              = "2024.10.00"
hilt                    = "2.56"
room                    = "2.7.0"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
coil                    = "2.7.0"
readium                 = "3.0.0"
googleDrive             = "v3-rev20240730-2.0.0"
googleAuth              = "21.2.0"
coroutines              = "1.8.1"
lifecycle               = "2.8.6"
navigation              = "2.8.3"
datastore               = "1.1.1"
workManager             = "2.9.1"
timber                  = "5.0.1"
kotlinxSerialization    = "1.7.3"
activityCompose         = "1.9.3"
adaptiveNavigation      = "1.0.0"
coreSplashscreen        = "1.0.1"

[libraries]
# ── Compose ──────────────────────────────────────────────────────────────────
compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling          = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material",  name = "material-icons-extended" }
compose-animation           = { group = "androidx.compose.animation", name = "animation" }
compose-foundation          = { group = "androidx.compose.foundation",name = "foundation" }
activity-compose            = { group = "androidx.activity",          name = "activity-compose",              version.ref = "activityCompose" }
navigation-compose          = { group = "androidx.navigation",        name = "navigation-compose",            version.ref = "navigation" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }
compose-window-size         = { group = "androidx.compose.material3", name = "material3-window-size-class" }
adaptive-navigation         = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptiveNavigation" }

# ── Hilt (Dependency Injection) ───────────────────────────────────────────────
hilt-android            = { group = "com.google.dagger", name = "hilt-android",            version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version = "1.3.0" }
hilt-work               = { group = "androidx.hilt",     name = "hilt-work",               version = "1.3.0" }

# ── Room (Local Database) ─────────────────────────────────────────────────────
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# ── Network ───────────────────────────────────────────────────────────────────
retrofit                   = { group = "com.squareup.retrofit2", name = "retrofit",             version.ref = "retrofit" }
retrofit-converter-gson    = { group = "com.squareup.retrofit2", name = "converter-gson",       version.ref = "retrofit" }
okhttp                     = { group = "com.squareup.okhttp3",   name = "okhttp",               version.ref = "okhttp" }
okhttp-logging             = { group = "com.squareup.okhttp3",   name = "logging-interceptor",  version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── Image Loading ──────────────────────────────────────────────────────────────
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ── Readium 3 (EPUB rendering) ────────────────────────────────────────────────
readium-shared    = { group = "org.readium.kotlin-toolkit", name = "readium-shared",    version.ref = "readium" }
readium-streamer  = { group = "org.readium.kotlin-toolkit", name = "readium-streamer",  version.ref = "readium" }
readium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-navigator", version.ref = "readium" }
readium-opds      = { group = "org.readium.kotlin-toolkit", name = "readium-opds",      version.ref = "readium" }

# ── Google Drive ───────────────────────────────────────────────────────────────
google-drive       = { group = "com.google.apis",     name = "google-api-services-drive", version.ref = "googleDrive" }
google-auth-client = { group = "com.google.android.gms", name = "play-services-auth",    version.ref = "googleAuth" }
google-http-android= { group = "com.google.http-client", name = "google-http-client-android", version = "1.44.1" }

# ── Persistence & Background Work ─────────────────────────────────────────────
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
work-runtime          = { group = "androidx.work",      name = "work-runtime-ktx",      version.ref = "workManager" }

# ── AppCompat (required by ReaderActivity / Readium Fragment host) ────────────
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# ── Splash screen (Android 12+ system launch screen customisation) ────────────
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# ── Utilities ─────────────────────────────────────────────────────────────────
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
timber             = { group = "com.jakewharton.timber", name = "timber",                     version.ref = "timber" }

[plugins]
android-application  = { id = "com.android.application",                        version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                   version.ref = "kotlin" }
kotlin-kapt          = { id = "org.jetbrains.kotlin.kapt",                      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",                 version.ref = "hilt" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
